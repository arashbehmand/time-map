[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905"]  # zip(strict=) is noise for same-length numpy arrays

[tool.pytest.ini_options]
testpaths = ["tests"]
# The `pytest` entry point (unlike `python -m pytest`) does not put the repo root on
# sys.path, so `import server` in tests needs this.
pythonpath = ["."]
addopts = "-q"
