<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Isochrone Warp Map</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"
        integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map-container"></div>
  <canvas id="warp-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>
  <div id="controls">
    <a href="/" id="portfolio-link">← Portfolio</a>
    <form id="search-form">
      <input id="search" type="text" placeholder="🔍 Search place or lat,lon…" autocomplete="off"
             title="Searches are sent to OpenStreetMap Nominatim through this site." />
    </form>
    <select id="profile">
      <option value="walking" selected>🚶 Walking</option>
      <option value="cycling">🚴 Cycling</option>
      <option value="driving">🚗 Driving</option>
    </select>
    <label>Minutes: <input id="times" type="text" value="5,10,15,20" /></label>
    <label>Zoom:
      <input id="zoom" type="range" min="10" max="16" value="14" />
      <span id="zoom-val">14</span>
    </label>
    <button id="warp-toggle">⟳ Warp</button>
    <button id="center-btn">📍 Centre</button>
    <span id="status">Waiting for location…</span>
  </div>
  <a id="mapbox-logo" href="https://www.mapbox.com/" target="_blank" rel="noopener" aria-label="Mapbox"><img
     src="/icons/mapbox-logo.svg" alt="Mapbox" width="80" height="20" /></a>
  <div id="attribution">
    <a href="https://www.mapbox.com/about/maps/" target="_blank" rel="noopener">© Mapbox</a>
    <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
    <strong><a href="https://apps.mapbox.com/feedback/" target="_blank" rel="noopener">Improve this map</a></strong>
    <span class="attr-note">· Searches use OpenStreetMap Nominatim</span>
  </div>
  <div id="loading" hidden>
    <div class="spinner"></div>
    <span id="loading-msg">Computing warp…</span>
  </div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
          integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
