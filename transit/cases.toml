# Fixed journeys for the go/no-go, the interchange probe and the gate's hand-picked cases.
# Public stations and landmarks only, never anybody's home. Coordinates are [lon, lat];
# station coordinates are the gb-transit parent stations (feed-2026-11-12).

# ── go/no-go: within 3 min of TfL Journey Planner, weekday 08-09, on the expected lines ──
# Station to station: TfL is asked by NaPTAN station id (tfl_from/tfl_to), R5 starts at the
# station's coordinate. Given coordinates instead, Journey Planner walks from the nearest
# street address (14 min at Heathrow T2&3), which is not what these journeys check.
[[journey]]
name = "Wembley Park -> Baker Street"
from = [-0.27883319612, 51.56384655293]
to = [-0.15786887032, 51.52244311522]
tfl_from = "940GZZLUWYP"
tfl_to = "940GZZLUBST"
expect_lines = "(?i)metropolitan|jubilee"
expect_mode = "SUBWAY"

[[journey]]
name = "Paddington -> Heathrow Terminals 2 & 3"
from = [-0.17617389915, 51.51599550289]
to = [-0.45410155064, 51.47185224744]
tfl_from = "910GPADTON"
tfl_to = "910GHTRWAPT"
expect_lines = "(?i)elizabeth|heathrow express|=XR|=HX|^XR$|^HX$"
expect_mode = "RAIL"

[[journey]]
name = "London Bridge -> East Croydon"
from = [-0.0860882393, 51.50510890486]
to = [-0.0927796195, 51.37545380421]
tfl_from = "910GLNDNBDC"     # TfL does not identify 910GLNDNBDE as a start
tfl_to = "910GECROYDN"
expect_lines = "(?i)thameslink|southern|=TL|=SN"
expect_mode = "RAIL"

