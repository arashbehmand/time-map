# Station ids typed by hand for the layout's checks and labels (gb-transit ids, as in
# points.csv of build 2026-11-12). points.csv says nothing about lines, so the Metropolitan
# line's order is listed here. An id missing from a build is reported as absent, never as a
# pass or a fail. Croxley, Watford, Chorleywood, Chalfont & Latimer, Chesham and Amersham are
# outside the build's area.

[wembley]
station = "gbt:910GCATEZWY"      # Wembley Park
reference = "gbt:910GLONDNBS"    # Baker Street

# Each run goes out from its first station; every station should sit further from that
# station on the map than the one before it.
[[metropolitan]]
name = "Baker Street to Aldgate"
stations = [
  "gbt:910GLONDNBS",   # Baker Street
  "gbt:940GZZLUGPS",   # Great Portland Street
  "gbt:940GZZLUESQ",   # Euston Square
  "gbt:910GKNGX",      # King's Cross St Pancras (the build's one "London Kings Cross")
  "gbt:910GFRNDNLT",   # Farringdon
  "gbt:940GZZLUBBN",   # Barbican
  "gbt:910GMRGT",      # Moorgate
  "gbt:910GLIVST",     # Liverpool Street
  "gbt:940GZZLUALD",   # Aldgate
]

