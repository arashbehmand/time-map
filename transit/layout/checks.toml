# Station ids typed by hand for the layout's checks and labels (gb-transit ids, as in
# points.csv of build 2026-11-12). points.csv says nothing about lines, so the Metropolitan
# line's order is listed here. An id missing from a build is reported as absent, never as a
# pass or a fail. Croxley, Watford, Chorleywood, Chalfont & Latimer, Chesham and Amersham are
# outside the build's area.

[wembley]
station = "gbt:910GCATEZWY"      # Wembley Park
reference = "gbt:910GLONDNBS"    # Baker Street

# More stations judged by the same rule (the full time map, #6 L-02, reports them; the
# stations-only job ignores them). Wembley Stadium is on the Chiltern line: against Baker Street
# like Wembley Park, and against Marylebone, the Chiltern terminus it is one stop from.
[[ratio]]
name = "Wembley Stadium to Baker Street"
station = "gbt:910GWEMBLSM"      # Wembley Stadium
reference = "gbt:910GLONDNBS"    # Baker Street

[[ratio]]
name = "Wembley Stadium to Marylebone"
station = "gbt:910GWEMBLSM"      # Wembley Stadium
reference = "gbt:910GMARYLBN"    # London Marylebone

# Train links the full time map must find in the feed (#6, L-02): one missing means the stops
# were joined to stations the wrong way, and the job stops.
[[required_link]]
a = "gbt:910GCATEZWY"            # Wembley Park
b = "gbt:910GFNCHMET"            # Finchley Road

[[required_link]]
a = "gbt:910GFNCHMET"            # Finchley Road
b = "gbt:910GLONDNBS"            # Baker Street

[[required_link]]
a = "gbt:910GWEMBLSM"            # Wembley Stadium
b = "gbt:910GMARYLBN"            # London Marylebone

# Pairs of stations a car should bring closer (the travel modes' spot check, #23 L-03): the report
# gives their map distance with train only and with car on. The job also picks the pair with the
# biggest gain by car by itself.
[[car_spot]]
name = "Along the A40 (Western Avenue)"
a = "gbt:940GZZLUWCY"              # White City
b = "gbt:940GZZLUPVL"              # Perivale

[[car_spot]]
name = "Across Wandsworth Bridge"
a = "gbt:940GZZLUFBY"              # Fulham Broadway
b = "gbt:910GCLPHMJC"              # Clapham Junction

# Each run is the line end to end, in order, through the bends at Baker Street and
